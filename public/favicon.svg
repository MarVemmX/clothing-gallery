<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1BF" />
      <stop offset="30%" stop-color="#E8C86A" />
      <stop offset="70%" stop-color="#C89B38" />
      <stop offset="100%" stop-color="#8A641A" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1F2126" />
      <stop offset="100%" stop-color="#0C0D0F" />
    </radialGradient>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Atelier Sovereign Monarch Chevron & Hanger Monogram -->
  <g>
    <!-- Hanger Hook Eyelet on Top -->
    <path d="M256 86 C282 86 302 106 302 132 C302 154 286 172 268 180 L268 206" 
          fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" />

    <!-- Monarch Peak Chevron A-Frame -->
    <path d="M136 400 L256 196 L376 400" 
          fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Crossbar Tailor's Needle Ribbon -->
    <path d="M182 322 L330 322" 
          fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" />

    <!-- Central Atelier Diamond Sovereign Gem -->
    <polygon points="256,234 276,264 256,294 236,264" fill="url(#gold)" />
  </g>
</svg>